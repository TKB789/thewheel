name: Update options data

on:
  schedule:
    # GitHub often starts scheduled runs late (sometimes hours late) or skips them when it's busy.
    # So the job is offered a start every 30 minutes on weekdays, and the "Decide what to run" step
    # does each update once: the first start inside each window that hasn't been served yet.
    #   10:00 AM ET  morning snapshot        1:00 PM ET  midday refresh
    #   3:15 PM ET   last look before close   after 4:15 PM ET  closing prices, study, paper trades
    # A missed after-close run is caught up by the next start, even the next morning.
    - cron: "11,41 13-23 * * 1-5"
    - cron: "11,41 0-3 * * 2-6"
    - cron: "5 16,17 * * 0,6"    # 12:05 PM ET weekends: headlines (or a missed Friday close)
  push:
    paths:
      - "watchlist.txt"          # your own edits; the job's own commits don't trigger runs
      - "research_config.json"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Look up one ticker (leave empty to update the whole watchlist)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false   # queue runs instead of cancelling one that's saving data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          IN_TICKER: ${{ inputs.ticker }}
        run: |
          TICKER=$(echo "$IN_TICKER" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          if [ -n "$TICKER" ]; then
            if ! echo "$TICKER" | grep -Eq '^[A-Z0-9.^=-]{1,12}$'; then echo "Not a ticker: $TICKER"; exit 1; fi
            echo "mode=single" >> "$GITHUB_OUTPUT"; echo "research=true" >> "$GITHUB_OUTPUT"; echo "backtest=true" >> "$GITHUB_OUTPUT"
            echo "ticker=$TICKER" >> "$GITHUB_OUTPUT"; echo "Looking up $TICKER"; exit 0
          fi
          if [ "$EVENT" != "schedule" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"; echo "research=true" >> "$GITHUB_OUTPUT"; echo "backtest=true" >> "$GITHUB_OUTPUT"
            echo "Manual or push run: full update"; exit 0
          fi
          LAST=$(cat data/last_full.txt 2>/dev/null || true)     # when the last full update was saved
          python3 - "$LAST" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo
          ET = ZoneInfo("America/New_York")
          now = datetime.now(ET)
          last = datetime.fromisoformat(sys.argv[1]).astimezone(ET) if len(sys.argv) > 1 and sys.argv[1] else None
          at = lambda d, h, m: datetime.combine(d, time(h, m), ET)
          # the most recent weekday close (4:15 PM ET) at or before now
          d = now.date()
          while d.weekday() > 4 or at(d, 16, 15) > now:
              d -= timedelta(days=1)
          close_slot = at(d, 16, 15)
          mode, research, backtest, why = "skip", "false", "false", ""
          if last is None or last < close_slot:
              mode, research = "full", "true"
              backtest = "true" if d.weekday() == 4 else "false"
              why = f"closing update for {d:%a %b %d}"
          elif now.weekday() <= 4:
              for h, m, h2, m2, name in ((10, 0, 13, 0, "morning"), (13, 0, 15, 15, "midday"), (15, 15, 16, 0, "before the close")):
                  if at(now.date(), h, m) <= now < at(now.date(), h2, m2) and last < at(now.date(), h, m):
                      mode, why = "full", name
          elif 12 <= now.hour < 13:
              mode, why = "headlines", "weekend headlines"
          print(f"mode={mode}\nresearch={research}\nbacktest={backtest}")
          print(f"New York {now:%a %H:%M}, last full update {last:%a %H:%M} -> {mode} {why}" if last else f"-> {mode} {why}", file=sys.stderr)
          PY


      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Fetch option chains
        if: steps.gate.outputs.mode == 'full' || steps.gate.outputs.mode == 'single'
        env:
          TICKER: ${{ steps.gate.outputs.ticker }}
        run: python scripts/fetch_options.py "$TICKER"

      - name: Collect headlines
        if: steps.gate.outputs.mode != 'skip'
        continue-on-error: true
        env:
          TICKER: ${{ steps.gate.outputs.ticker }}
        run: python scripts/headlines.py "$TICKER"

      - name: Run correlation study
        if: steps.gate.outputs.research == 'true'
        continue-on-error: true   # a study failure shouldn't block fresh option data
        env:
          TICKER: ${{ steps.gate.outputs.ticker }}
        run: python scripts/research.py "$TICKER"

      - name: Backtest (Monday calls expiring Friday)
        if: steps.gate.outputs.backtest == 'true'
        continue-on-error: true
        env:
          TICKER: ${{ steps.gate.outputs.ticker }}
        run: python scripts/backtest.py "$TICKER"

      - name: Paper trading
        if: steps.gate.outputs.mode == 'full'
        continue-on-error: true
        run: python scripts/paper.py

      - name: Add looked-up ticker to the watchlist
        if: steps.gate.outputs.mode == 'single'
        env:
          TICKER: ${{ steps.gate.outputs.ticker }}
        run: grep -qx "$TICKER" watchlist.txt || echo "$TICKER" >> watchlist.txt

      - name: Commit data
        if: steps.gate.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          TICKER: ${{ steps.gate.outputs.ticker }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "full" ]; then date -u +%Y-%m-%dT%H:%M:%S+00:00 > data/last_full.txt; fi
          git add data watchlist.txt
          git diff --cached --quiet || git commit -m "Update data ($MODE${TICKER:+ $TICKER})"
          git pull --rebase
          git push
